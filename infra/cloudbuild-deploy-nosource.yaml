# Build + deploy from the gcp branch on GitHub, entirely inside Google's network.
# Run from Cloud Shell (uploads nothing):
#   gcloud builds submit --no-source --region=asia-south1 --config=infra/cloudbuild-deploy-nosource.yaml \
#     --service-account="projects/paatam-ai/serviceAccounts/paatam-dev-deployer@paatam-ai.iam.gserviceaccount.com" \
#     --substitutions=_DATA_BACKEND=alloydb      # or _DATA_BACKEND=supabase
substitutions:
  _REGION: asia-south1
  _DATA_BACKEND: alloydb
  _IMAGES: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/paatam-dev
  _DOCKERHUB: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/dockerhub
options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 3600s
steps:
  - id: clone
    name: gcr.io/cloud-builders/git
    args: ["clone", "--depth=1", "--branch=gcp", "https://github.com/PAATAM-AI/Paatam.git", "src"]
  - id: build-api
    name: gcr.io/cloud-builders/docker
    waitFor: ["clone"]
    args: ["build", "--build-arg", "REGISTRY=${_DOCKERHUB}", "-t", "${_IMAGES}/api:${BUILD_ID}", "src/smartstudy-backend"]
  - id: build-web
    name: gcr.io/cloud-builders/docker
    waitFor: ["clone"]
    args: ["build", "--build-arg", "REGISTRY=${_DOCKERHUB}", "-t", "${_IMAGES}/web:${BUILD_ID}", "src/smartstudy-frontend"]
  - id: push-api
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-api"]
    args: ["push", "${_IMAGES}/api:${BUILD_ID}"]
  - id: push-web
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-web"]
    args: ["push", "${_IMAGES}/web:${BUILD_ID}"]
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ["push-api", "push-web"]
    dir: src
    entrypoint: bash
    env:
      - PROJECT=${PROJECT_ID}
      - REGION=${_REGION}
      - SKIP_BUILD=1
      - DATA_BACKEND=${_DATA_BACKEND}
      - API_IMAGE=${_IMAGES}/api:${BUILD_ID}
      - WEB_IMAGE=${_IMAGES}/web:${BUILD_ID}
    args: ["infra/deploy.sh"]
