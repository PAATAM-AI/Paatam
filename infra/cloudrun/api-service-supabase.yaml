# Cloud Run service: Paatam API using the existing Supabase project as its database (fallback mode).
# Rendered by infra/deploy.sh with envsubst; do not put secret values here.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${API_SERVICE}
  labels:
    app: paatam
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: ${API_SA}
      timeoutSeconds: 900
      containerConcurrency: 40
      containers:
        - name: api
          image: ${API_IMAGE}
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          env:
            - name: NODE_ENV
              value: production
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_PREFIX}-supabase-url
                  key: latest
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_PREFIX}-supabase-anon-key
                  key: latest
            - name: GCS_BUCKET
              value: ${GCS_BUCKET}
            - name: GOOGLE_CLOUD_PROJECT
              value: ${PROJECT_ID}
            - name: AI_BACKEND
              value: vertex
            - name: VERTEX_LOCATION
              value: ${VERTEX_LOCATION}
            - name: GEMINI_MODEL
              value: ${GEMINI_MODEL}
            - name: GEMINI_IMAGE_MODEL
              value: ${GEMINI_IMAGE_MODEL}
            - name: EMBEDDING_MODEL
              value: gemini-embedding-001
            - name: PRIMARY_AI_PROVIDER
              value: gemini
            - name: BQ_DATASET
              value: ${BQ_DATASET}
            - name: BQ_LOCATION
              value: ${REGION}
            - name: CORS_ORIGINS
              value: ${WEB_URL}
            - name: ALLOW_DB_RESET
              value: "false"
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_PREFIX}-app-jwt-secret
                  key: latest
${OPTIONAL_SECRET_ENV}
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 24
